<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neola: The Enchanted Forest</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#10152b;color:white;
  font-family:system-ui,Arial,sans-serif;
  display:flex;justify-content:center;min-height:100vh;
}
#app{width:min(100%,1000px);padding:14px}
h1{text-align:center;margin:5px;color:#d9c5ff}
#hud{
 display:flex;justify-content:space-between;gap:8px;
 flex-wrap:wrap;padding:10px;background:#222746;
 border-radius:12px;margin-bottom:10px
}
#gamebox{position:relative;width:100%}
canvas{
 width:100%;display:block;background:#203d36;
 border:3px solid #7868a8;border-radius:12px;
 image-rendering:pixelated
}
#message{
 position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);
 text-align:center;width:90%;font-size:20px;font-weight:bold;
 text-shadow:0 2px 5px black;pointer-events:none
}
#help{color:#d5d8ef;font-size:13px;line-height:1.6;margin:10px 0}
button{
 border:0;border-radius:10px;padding:10px 14px;
 background:#8065bd;color:white;font-weight:bold;cursor:pointer;
}
button:hover{background:#9b7bd9}
#controls{
 display:none;grid-template-columns:repeat(3,58px);
 gap:6px;justify-content:center;margin:12px auto
}
#controls button{height:48px;padding:4px;font-size:18px}
#controls .wide{grid-column:span 3}
@media(max-width:650px){
 #controls{display:grid}
 #hud{font-size:13px}
}
</style>
</head>
<body>
<div id="app">
<h1>✨ Neola: The Enchanted Forest ✨</h1>

<div id="hud">
 <span id="level">Realm 1 / 8</span>
 <span id="hp">❤️❤️❤️</span>
 <span id="crystals">💎 0 / 5</span>
 <span id="magic">🔮 0</span>
 <span id="inventory">Items: —</span>
 <button id="restart">Restart</button>
</div>

<div id="gamebox">
 <canvas id="game" width="800" height="520"></canvas>
 <div id="message"></div>
</div>

<div id="controls">
 <span></span><button data-key="ArrowUp">▲</button><span></span>
 <button data-key="ArrowLeft">◀</button>
 <button data-key="ArrowDown">▼</button>
 <button data-key="ArrowRight">▶</button>
 <button class="wide" data-key="f">🔮 Magic Attack</button>
 <button class="wide" data-key=" ">⚡ Dash</button>
</div>

<div id="help">
 <b>Move:</b> WASD / Arrow Keys &nbsp;
 <b>Dash:</b> Space / Shift &nbsp;
 <b>Attack:</b> F or click the game &nbsp;
 <b>Collect:</b> Walk over items and crystals.<br>
 Defeat enemies, collect enough crystals, and enter the glowing portal.
 Enemies become faster in later realms!
</div>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const $ = id => document.getElementById(id);

const realms = [
 {name:"Whispering Woods",bg:"#254b3c",wall:"#386b4b",need:5,foes:3},
 {name:"Moonlit Marsh",bg:"#243c55",wall:"#375c70",need:6,foes:4},
 {name:"Crystal Caverns",bg:"#3b285c",wall:"#624b8b",need:7,foes:5},
 {name:"Shadow Kingdom",bg:"#29283e",wall:"#494363",need:8,foes:6},
 {name:"Frostveil Peaks",bg:"#31536a",wall:"#7098b1",need:9,foes:7},
 {name:"Ember Ruins",bg:"#542d2b",wall:"#904b37",need:10,foes:8},
 {name:"Dream Labyrinth",bg:"#3c285c",wall:"#70519a",need:11,foes:9},
 {name:"The Heart of Magic",bg:"#39233d",wall:"#a04e83",need:12,foes:1}
];

let level, player, enemies, gems, flowers, drops, shots, portal;
let walls, particles, keys = {};
let gameState = "playing";
let lastTime = 0;
let messageTimer = 0;
let boss = null;

function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

function newPlayer(){
 return {
  x:65,y:H/2,size:17,hp:3,maxHp:3,
  speed:2.5,magic:0,crystals:0,flowers:0,
  faceX:1,faceY:0,invuln:0,
  dash:0,dashCooldown:0,
  speedUntil:0,shieldUntil:0,
  attackCooldown:0
 };
}

function showMessage(text,seconds=2){
 $("message").textContent=text;
 messageTimer=seconds;
}

function makeWalls(){
 walls=[];
 // Decorative obstacle layout; leave paths between areas.
 const count=5+level;
 for(let i=0;i<count;i++){
  const x=rand(140,W-150), y=rand(45,H-45);
  const ww=rand(28,65), hh=rand(25,58);
  if(Math.abs(x-65)<100 || Math.abs(x-(W-65))<100)continue;
  walls.push({x,y,w:ww,h:hh});
 }
}

function blocked(x,y,r){
 if(x-r<0||x+r>W||y-r<0||y+r>H)return true;
 return walls.some(w=>
  x+r>w.x&&x-r<w.x+w.w&&
  y+r>w.y&&y-r<w.y+w.h
 );
}

function moveEntity(e,dx,dy,r){
 if(!blocked(e.x+dx,e.y,r))e.x+=dx;
 if(!blocked(e.x,e.y+dy,r))e.y+=dy;
}

function safePosition(minDistance=100){
 let p;
 for(let i=0;i<100;i++){
  p={x:rand(45,W-45),y:rand(45,H-45)};
  if(!blocked(p.x,p.y,18)&&dist(p,player)>minDistance)return p;
 }
 return {x:W/2,y:H/2};
}

function makeLevel(n){
 level=n;
 gameState="playing";
 player=newPlayer();
 enemies=[];gems=[];flowers=[];drops=[];shots=[];particles=[];
 boss=null;
 makeWalls();

 for(let i=0;i<realms[level].need;i++){
  const p=safePosition(140);
  gems.push({...p,r:9,bob:rand(0,6)});
 }
 for(let i=0;i<3+level;i++){
  const p=safePosition(120);
  flowers.push({...p,r:8,bob:rand(0,6)});
 }

 if(level<7){
  for(let i=0;i<realms[level].foes;i++)spawnEnemy(false);
 }else{
  const p=safePosition(240);
  boss={...p,x:p.x,y:p.y,r:29,hp:14,maxHp:14,
        speed:0.8,attackTimer:0,flash:0};
 }

 portal={x:W-55,y:H/2,r:24,open:false};
 showMessage(realms[level].name,2.4);
 updateHUD();
}

function spawnEnemy(isBoss=false,x=null,y=null){
 const p=(x===null)?safePosition(150):{x,y};
 enemies.push({
  x:p.x,y:p.y,r:isBoss?24:15,
  hp:isBoss?5:2,maxHp:isBoss?5:2,
  speed:(0.7+level*0.13)*rand(0.85,1.15),
  active:false,patrol:rand(0,6),
  attackTimer:0,flash:0
 });
}

function spawnDrop(x,y){
 // 50% chance of a random drop after a normal enemy is defeated.
 if(Math.random()>=0.5)return;
 const r=Math.random();
 let type;
 if(r<0.25)type="health";
 else if(r<0.48)type="speed";
 else if(r<0.78)type="magic";
 else if(r<0.94)type="shield";
 else type="crystal";

 drops.push({x,y,type,r:12,bob:rand(0,6),life:18});
}

const itemInfo={
 health:{emoji:"❤️",name:"Health Potion"},
 speed:{emoji:"⚡",name:"Speed Potion"},
 magic:{emoji:"🔮",name:"Magic Orb"},
 shield:{emoji:"🛡️",name:"Magic Shield"},
 crystal:{emoji:"💎",name:"Bonus Crystals"}
};

function collectDrop(item){
 switch(item.type){
  case "health":
   player.hp=Math.min(player.maxHp,player.hp+1);
   showMessage("❤️ Health restored!");
   break;
  case "speed":
   player.speedUntil=performance.now()+5000;
   showMessage("⚡ Speed boost: 5 seconds!");
   break;
  case "magic":
   player.magic+=1;
   showMessage("🔮 Magic Orb collected!");
   break;
  case "shield":
   player.shieldUntil=performance.now()+5000;
   showMessage("🛡️ Shield activated!");
   break;
  case "crystal":
   player.crystals+=3;
   showMessage("💎 Bonus: +3 crystals!");
   break;
 }
 updateHUD();
}

function damagePlayer(amount=1){
 const now=performance.now();
 if(player.invuln>0 || now<player.shieldUntil)return;
 player.hp-=amount;
 player.invuln=1.1;
 burst(player.x,player.y,"#ff7b9b",12);
 if(player.hp<=0){
  player.hp=0;
  gameState="dead";
  showMessage("You were caught! Press Restart to try again.",999);
 }else{
  showMessage("Ouch! Watch out for the monsters!",1.2);
 }
 updateHUD();
}

function defeatEnemy(e){
 spawnDrop(e.x,e.y);
 burst(e.x,e.y,"#d7b7ff",14);
}

function burst(x,y,color,n){
 for(let i=0;i<n;i++){
  particles.push({
   x,y,vx:rand(-2.5,2.5),vy:rand(-2.5,2.5),
   life:rand(0.25,0.7),color
  });
 }
}

function attack(){
 if(gameState!=="playing"||player.magic<=0||player.attackCooldown>0)return;
 player.magic--;
 player.attackCooldown=0.3;

 let target=null,best=Infinity;
 const targets=[...enemies.filter(e=>e.hp>0)];
 if(boss&&boss.hp>0)targets.push(boss);

 for(const e of targets){
  const d=dist(player,e);
  if(d<best){best=d;target=e}
 }
 if(!target){
  showMessage("No monsters nearby!",1);
  return;
 }
 const dx=target.x-player.x,dy=target.y-player.y;
 const len=Math.hypot(dx,dy)||1;
 shots.push({
  x:player.x,y:player.y,
  vx:dx/len*6,vy:dy/len*6,
  r:7,life:1.5
 });
}

function dash(){
 if(gameState!=="playing"||player.dashCooldown>0)return;
 player.dash=0.18;
 player.dashCooldown=1.1;
 player.invuln=Math.max(player.invuln,0.22);
}

function update(dt,now){
 if(gameState!=="playing")return;

 player.invuln=Math.max(0,player.invuln-dt);
 player.dash=Math.max(0,player.dash-dt);
 player.dashCooldown=Math.max(0,player.dashCooldown-dt);
 player.attackCooldown=Math.max(0,player.attackCooldown-dt);

 let dx=0,dy=0;
 if(keys.ArrowLeft||keys.a||keys.A)dx--;
 if(keys.ArrowRight||keys.d||keys.D)dx++;
 if(keys.ArrowUp||keys.w||keys.W)dy--;
 if(keys.ArrowDown||keys.s||keys.S)dy++;

 const len=Math.hypot(dx,dy)||1;
 if(dx||dy){
  dx/=len;dy/=len;
  player.faceX=dx;player.faceY=dy;
 }
 let speed=player.speed;
 if(now<player.speedUntil)speed*=1.65;
 if(player.dash>0)speed*=2.8;
 moveEntity(player,dx*speed,dy*speed,player.size);

 // Collect crystals.
 for(let i=gems.length-1;i>=0;i--){
  if(dist(player,gems[i])<player.size+gems[i].r){
   gems.splice(i,1);
   player.crystals++;
   burst(player.x,player.y,"#80f5ff",7);
   updateHUD();
  }
 }
 // Optional flowers give small bonus.
 for(let i=flowers.length-1;i>=0;i--){
  if(dist(player,flowers[i])<player.size+flowers[i].r){
   flowers.splice(i,1);
   player.flowers++;
   if(player.flowers%3===0)player.magic++;
   burst(player.x,player.y,"#ffb6ed",5);
   updateHUD();
  }
 }
 // Pick up dropped items.
 for(let i=drops.length-1;i>=0;i--){
  const item=drops[i];
  item.bob+=dt*4;
  item.life-=dt;
  if(dist(player,item)<player.size+item.r){
   collectDrop(item);
   drops.splice(i,1);
  }else if(item.life<=0){
   drops.splice(i,1);
  }
 }

 // Monsters chase when close enough; otherwise patrol.
 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];
  if(e.hp<=0){enemies.splice(i,1);continue}
  e.flash=Math.max(0,e.flash-dt);
  e.attackTimer=Math.max(0,e.attackTimer-dt);
  const d=dist(player,e);

  if(d<300)e.active=true;
  if(d>390)e.active=false;

  if(e.active){
   const vx=(player.x-e.x)/(d||1);
   const vy=(player.y-e.y)/(d||1);
   moveEntity(e,vx*e.speed,vy*e.speed,e.r);
  }else{
   e.patrol+=dt;
   moveEntity(e,Math.cos(e.patrol)*e.speed*0.4,
                 Math.sin(e.patrol*0.8)*e.speed*0.4,e.r);
  }
  if(d<player.size+e.r){
   damagePlayer();
   if(e.attackTimer<=0)e.attackTimer=0.8;
  }
 }

 // Final boss.
 if(boss&&boss.hp>0){
  boss.flash=Math.max(0,boss.flash-dt);
  boss.attackTimer-=dt;
  const d=dist(player,boss);
  const vx=(player.x-boss.x)/(d||1);
  const vy=(player.y-boss.y)/(d||1);
  moveEntity(boss,vx*boss.speed,vy*boss.speed,boss.r);

  if(d<player.size+boss.r){
   damagePlayer();
  }
  // Boss summons minions occasionally.
  if(boss.attackTimer<=0&&enemies.length<4){
   spawnEnemy(false,boss.x+rand(-40,40),boss.y+rand(-40,40));
   boss.attackTimer=4;
   showMessage("The Boss summons a guardian!",1.3);
  }
 }

 // Move magic projectiles and detect hits.
 for(let i=shots.length-1;i>=0;i--){
  const s=shots[i];
  s.x+=s.vx;
  s.y+=s.vy;
  s.life-=dt;
  let hit=false;
  for(const e of enemies){
   if(e.hp>0&&dist(s,e)<s.r+e.r){
    e.hp--;
    e.flash=0.15;
    burst(e.x,e.y,"#c9a7ff",5);
    if(e.hp<=0)defeatEnemy(e);
    hit=true;break;
   }
  }
  if(!hit&&boss&&boss.hp>0&&dist(s,boss)<s.r+boss.r){
   boss.hp--;
   boss.flash=0.18;
   burst(boss.x,boss.y,"#ff9de2",7);
   hit=true;
   if(boss.hp<=0){
    boss.hp=0;
    for(let i=0;i<5;i++)spawnDrop(boss.x+rand(-25,25),boss.y+rand(-25,25));
    burst(boss.x,boss.y,"#ffe89b",40);
    showMessage("The Forest Guardian is defeated!",3);
   }
  }
  if(hit||s.life<=0||s.x<0||s.x>W||s.y<0||s.y>H){
   shots.splice(i,1);
  }
 }

 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.x+=p.vx;p.y+=p.vy;p.life-=dt;
  if(p.life<=0)particles.splice(i,1);
 }

 portal.open = gems.length===0;
 if(level===7&&boss&&boss.hp>0)portal.open=false;

 if(portal.open&&dist(player,portal)<player.size+portal.r){
  if(level<7){
   makeLevel(level+1);
  }else{
   gameState="won";
   showMessage("✨ You saved the Enchanted Forest! ✨",999);
  }
 }
 updateHUD();
}

function draw(){
 const realm=realms[level];
 ctx.fillStyle=realm.bg;
 ctx.fillRect(0,0,W,H);

 // Ground details.
 for(let x=10;x<W;x+=40){
  for(let y=10;y<H;y+=40){
   ctx.globalAlpha=0.10;
   ctx.fillStyle=realm.wall;
   ctx.fillRect(x,y,2,2);
  }
 }
 ctx.globalAlpha=1;

 // Obstacles.
 for(const w of walls){
  ctx.fillStyle=realm.wall;
  ctx.fillRect(w.x,w.y,w.w,w.h);
  ctx.strokeStyle="rgba(255,255,255,.15)";
  ctx.strokeRect(w.x,w.y,w.w,w.h);
 }

 // Flowers.
 for(const f of flowers){
  const bob=Math.sin(f.bob+=0.025)*2;
  ctx.font="19px sans-serif";
  ctx.textAlign="center";
  ctx.fillText("🌸",f.x,f.y+bob+6);
 }

 // Crystals.
 for(const g of gems){
  const bob=Math.sin(g.bob+=0.04)*3;
  ctx.save();
  ctx.translate(g.x,g.y+bob);
  ctx.rotate(Math.PI/4);
  ctx.fillStyle="#7df5ff";
  ctx.shadowColor="#7df5ff";
  ctx.shadowBlur=13;
  ctx.fillRect(-7,-7,14,14);
  ctx.restore();
  ctx.shadowBlur=0;
 }

 // Portal.
 ctx.beginPath();
 ctx.arc(portal.x,portal.y,portal.r+4,0,Math.PI*2);
 ctx.fillStyle=portal.open?"#b8ffdb":"#53486b";
 ctx.fill();
 ctx.beginPath();
 ctx.arc(portal.x,portal.y,portal.r-5,0,Math.PI*2);
 ctx.fillStyle=portal.open?"#4ef6c1":"#26213d";
 ctx.fill();
 ctx.font="23px sans-serif";
 ctx.textAlign="center";
 ctx.fillText(portal.open?"✨":"🔒",portal.x,portal.y+8);

 // Drops.
 for(const item of drops){
  const info=itemInfo[item.type];
  const bob=Math.sin(item.bob)*4;
  ctx.beginPath();
  ctx.arc(item.x,item.y+bob,item.r+5,0,Math.PI*2);
  ctx.fillStyle="#fff5a8";
  ctx.globalAlpha=0.25;
  ctx.fill();
  ctx.globalAlpha=1;
  ctx.font="23px sans-serif";
  ctx.fillText(info.emoji,item.x,item.y+bob+8);
 }

 // Enemies.
 for(const e of enemies){
  if(e.hp<=0)continue;
  ctx.font="29px sans-serif";
  ctx.fillText(e.flash>0?"💥":"👾",e.x,e.y+9);
  drawBar(e.x-17,e.y-24,34,e.hp/e.maxHp);
 }

 // Boss.
 if(boss&&boss.hp>0){
  ctx.font="54px sans-serif";
  ctx.fillText(boss.flash>0?"💥":"🐉",boss.x,boss.y+18);
  drawBar(boss.x-40,boss.y-42,80,boss.hp/boss.maxHp);
  ctx.fillStyle="white";
  ctx.font="14px sans-serif";
  ctx.fillText("FOREST GUARDIAN",boss.x,boss.y-49);
 }

 // Magic projectiles.
 for(const s of shots){
  ctx.beginPath();
  ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
  ctx.fillStyle="#e5a6ff";
  ctx.shadowColor="#cf75ff";
  ctx.shadowBlur=15;
  ctx.fill();
  ctx.shadowBlur=0;
 }

 // Player.
 if(player.invuln>0&&Math.floor(performance.now()/100)%2===0){
  ctx.globalAlpha=0.45;
 }
 ctx.beginPath();
 ctx.arc(player.x,player.y,player.size,0,Math.PI*2);
 ctx.fillStyle="#f4d7ff";
 ctx.shadowColor="#d89cff";
 ctx.shadowBlur=14;
 ctx.fill();
 ctx.shadowBlur=0;
 ctx.font="24px sans-serif";
 ctx.fillText("🧙",player.x,player.y+8);
 ctx.globalAlpha=1;

 if(performance.now()<player.shieldUntil){
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.size+8,0,Math.PI*2);
  ctx.strokeStyle="#8cf5ff";
  ctx.lineWidth=3;
  ctx.stroke();
 }

 // Particles.
 for(const p of particles){
  ctx.globalAlpha=clamp(p.life,0,1);
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,4,4);
 }
 ctx.globalAlpha=1;

 if(!portal.open){
  ctx.fillStyle="rgba(0,0,0,.55)";
  ctx.fillRect(12,H-32,245,22);
  ctx.fillStyle="#fff";
  ctx.font="13px sans-serif";
  ctx.textAlign="left";
  ctx.fillText(
   level===7&&boss&&boss.hp>0
    ?"Defeat the Forest Guardian!"
    :"Collect all crystals to open the portal",
   20,H-17
  );
 }

 if(gameState==="dead"||gameState==="won"){
  ctx.fillStyle="rgba(8,8,25,.58)";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="white";
  ctx.textAlign="center";
  ctx.font="bold 34px system-ui";
  ctx.fillText(gameState==="won"?"FOREST SAVED!":"GAME OVER",W/2,H/2-10);
  ctx.font="18px system-ui";
  ctx.fillText("Press Restart to play again",W/2,H/2+27);
 }
}

function drawBar(x,y,w,p){
 ctx.fillStyle="#30273e";
 ctx.fillRect(x,y,w,5);
 ctx.fillStyle="#ff6c9c";
 ctx.fillRect(x,y,w*clamp(p,0,1),5);
}

function updateHUD(){
 $("level").textContent=`Realm ${level+1} / 8 — ${realms[level].name}`;
 $("hp").textContent="❤️".repeat(player.hp)+"🖤".repeat(player.maxHp-player.hp);
 $("crystals").textContent=`💎 ${player.crystals}`;
 $("magic").textContent=`🔮 ${player.magic}`;
 const now=performance.now();
 let items=[];
 if(now<player.speedUntil)items.push("⚡");
 if(now<player.shieldUntil)items.push("🛡️");
 $("inventory").textContent="Items: "+(items.join(" ")||"—");
}

function frame(now){
 const dt=Math.min((now-lastTime)/1000||0,0.04);
 lastTime=now;
 if(messageTimer>0){
  messageTimer-=dt;
  if(messageTimer<=0)$("message").textContent="";
 }
 update(dt,now);
 draw();
 requestAnimationFrame(frame);
}

window.addEventListener("keydown",e=>{
 const k=e.key;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," ","Shift"].includes(k))
  e.preventDefault();
 keys[k]=true;
 if(!e.repeat){
  if(k===" "||k==="Shift")dash();
  if(k.toLowerCase()==="f")attack();
 }
});
window.addEventListener("keyup",e=>{keys[e.key]=false});

canvas.addEventListener("click",attack);

document.querySelectorAll("[data-key]").forEach(btn=>{
 const k=btn.dataset.key;
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[k]=true;
  if(k===" ")dash();
  if(k==="f")attack();
 });
